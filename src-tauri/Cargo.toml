[package]
name = "voxel-studio"
version = "0.1.0"
description = "Volumetric pixel mapping and real-time sensor modulation for addressable LEDs over UDP DDP"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"
midir = "0.11.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

[lints.clippy]
panic            = "deny"
unimplemented    = "deny"
dbg_macro        = "deny"
todo             = "warn"
unwrap_used      = "warn"
expect_used      = "warn"
unwrap_in_result = "warn"
